  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="95 35" stroke-linecap="round" transform="rotate(-90 32 32)"/>

  <!-- Checkmark (Habit Completed) -->
